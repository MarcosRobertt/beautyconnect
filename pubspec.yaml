name: beautyconnect
description: BeautyConnect - MVP Flutter Web (Sprint 1) - Dashboard, Clientes, Agenda, persistência local via Hive/IndexedDB, backup em JSON.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.4.0
  intl: any
  # Dependências do banco de dados na nuvem
  firebase_core: any
  cloud_firestore: any
  firebase_auth: any
  # Importação de Contatos
  flutter_contacts: ^1.1.7
  # Abertura de URLs externas / WhatsApp / Download de arquivos
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
