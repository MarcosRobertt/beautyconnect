<!DOCTYPE html>
<html>
<head>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden !important; 
      position: fixed !important; /* Isto impede o iPhone de empurrar a tela */
      touch-action: none;
    }
  </style>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BeautyConnect - MVP para manicures, 100% local, sem servidor.">
  
  <!-- 🚀 CORREÇÃO 1: Viewport atualizado para proibir zoom e usar a tela toda (evita buracos) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BeautyConnect">

  <title>BeautyConnect</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <!-- 🚀 CORREÇÃO 2: INÍCIO DA CORREÇÃO DO BUG DO IOS PWA (TELA SUBINDO) -->
  <script>
    function corrigirViewportIOS() {
      setTimeout(function() {
        // Força a rolagem de volta para o topo absoluto
        window.scrollTo(0, 0);
        document.body.scrollTop = 0;
        document.documentElement.scrollTop = 0;
        
        // Dá um "susto" no Flutter simulando que a tela mudou de tamanho. 
        // Isso obriga o Flutter a recalcular o espaço e puxar a barra de volta para o rodapé.
        window.dispatchEvent(new Event('resize'));
      }, 150); // Atraso de 150ms para dar tempo da animação do iPhone terminar
    }

    // Dispara quando volta ao aplicativo (foco da janela)
    window.addEventListener('focus', corrigirViewportIOS);
    
    // Dispara quando o aplicativo volta a ficar visível na tela (alternância de apps)
    window.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        corrigirViewportIOS();
      }
    });
  </script>
  <!-- FIM DA CORREÇÃO -->
</body>
</html>
